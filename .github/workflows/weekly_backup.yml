name: Sauvegarde Hebdomadaire Base Turso -> Cloudinary

on:
  schedule:
    # Exécution automatique chaque dimanche matin à 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      retention_days:
        description: 'Nombre de jours de rétention (suppression des backups plus anciens)'
        required: false
        default: '30'

jobs:
  backup:
    name: Backup Base de Données vers Cloudinary
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Exécuter la sauvegarde et la purge de rétention
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          RETENTION=${{ github.event.inputs.retention_days || 30 }}
          python scripts/backup_db.py --retention $RETENTION
